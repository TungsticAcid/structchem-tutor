<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      ★ viewport-fit=cover 必须写，否则 env(safe-area-inset-*) 恒为 0px，
        tokens.css 里的 --safe-* 四个令牌全部失效（crystal 的旧 index.html 就缺这一条，
        导致它 6 处安全区 padding 形同虚设——这是实测确认过的缺陷）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>结构化学教学智能体</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>结构化学教学智能体</h1>
        <span class="subtitle">一个中枢 · 可插拔教学模块</span>
      </div>
      <div class="top-meta">
        <!-- 模块切换：目前只有晶体模块，其余接入后自动出现在这里 -->
        <div class="seg" id="moduleSeg"></div>
        <button class="btn btn-ghost" id="settingsBtn" type="button">设置</button>
      </div>
    </header>

    <main class="layout">
      <section class="grid-main">
        <div class="card">
          <div class="card-head">
            <span class="card-title" id="viewerTitle">晶体结构</span>
            <div class="card-head-right">
              <!-- 晶体选择：用户与智能体走**同一条动作通路**（facade.applyActions），
                   这样才能被感知层记进交互痕迹，也保证界面状态与实际画面一致 -->
              <div class="seg small" id="crystalSeg"></div>
            </div>
          </div>
          <!-- 三维视图挂载点。viewer.js 会按"可见高度 − 顶端位置"算 --viewer-h -->
          <div id="viewer" class="viewer chart-host"></div>
          <div class="card-head" style="margin-top:10px">
            <span class="card-title">图层</span>
          </div>
          <div id="layerBar" class="seg small" style="flex-wrap:wrap;gap:6px"></div>
        </div>

        <aside class="card">
          <div class="card-head"><span class="card-title">视角与外观</span></div>
          <div id="viewBar" class="seg small" style="flex-wrap:wrap;gap:6px"></div>
          <div id="appearanceBar" style="margin-top:12px"></div>
          <div class="divider" style="margin:14px 0"><span>演示</span></div>
          <div id="storyboardBar" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </aside>
      </section>
    </main>

    <footer class="foot">
      纯前端 · 模型由使用者自备（BYOK）· 数值一律由程序计算
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
