<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      ★ viewport-fit=cover 必须写，否则 env(safe-area-inset-*) 恒为 0px，
        tokens.css 里的 --safe-* 四个令牌全部失效（crystal 的旧 index.html 就缺这一条，
        导致它 6 处安全区 padding 形同虚设——这是实测确认过的缺陷）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      ★ 图标复用智能体形象（浏览器标签页与右下角悬浮球是同一个）。
        它已经在 public/ 里（供面板的 iconSrc 用），所以不会再有 `/favicon.ico` 的 404。
        此前这里用的是内联 SVG data URI，那是"public 里还没有图标"时的权宜做法。
    -->
    <link rel="icon" type="image/png" href="%BASE_URL%agent-icon.png" />
    <!--
      KaTeX 样式（公式渲染）。★ CSS **不**懒加载：没有它时 KaTeX 生成的 HTML
      是一堆错位的 span，看起来像渲染坏了——"样式错乱"比"稍晚出现"糟得多。
      而 JS（277 KB）走懒加载，见 packages/agent-core/ui/katex-loader.js。

      ★ 用 `%BASE_URL%` 而不是写死的 `/katex/...`：base 是 `'./'`，部署到子路径时
        写死绝对路径会 404，而 404 只表现为"公式没样式"，不报错。
    -->
    <link rel="stylesheet" href="%BASE_URL%katex/katex.min.css" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>结构化学教学智能体</title>
    <!--
      ★ 首帧前定主题（避免"先按深色画一帧、再跳成浅色"的闪一下）。

      § 与 @ui-kit/theme.js 是**同一套判据**：显式选的直接写，'system' 交给
        matchMedia 解析 —— 解析结果同样写进 `data-theme`。属性是**唯一**真源，
        CSS 里不再有 prefers-color-scheme 那一份"第二套浅色调色板"
        （那正是"跟随系统"看起来跟浅色/深色都不一样的根因）。
      § 必须是**行内**脚本：模块脚本是 defer 的，等到那时第一帧已经画完了。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('chem-agent.theme') || 'system'
          var resolved = (t === 'dark' || t === 'light')
            ? t
            : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) { /* 隐私模式等：交给运行时，最多闪一下 */ }
      })()
    </script>
  </head>
  <body>
    <!--
      ★ 页面结构极简：只有 #app 一个容器。
        上一版把顶栏、侧栏（视角/图层/晶胞）、页脚全写在这里，是"壳自己画界面"的思路；
        本版改为**壳只提供容器与路由，界面由各模块的页面负责**——
        这样可以整份复用 crystal 应用那套为教学设计过的页面，而不是手搓一份仿制品。
        智能体面板挂在 document.body（不在这里），所以切页不会把它清掉。
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
