# 安全响应头（Nginx 片段）
#
# 用法：把这一段整体放进站点的 `server { … }` 里（或 `location / { … }` 里）。
#   include /etc/nginx/snippets/structchem-security-headers.conf;
#
# ★ 为什么这些头必须由**服务器**给，而不是只靠 index.html 的 <meta>：
#   · `frame-ancestors` 在 <meta> 里会被浏览器**忽略**（规范如此，静默无效）；
#   · <meta> 只保护它所在的那个文档，管不到 XHR/字体等其它资源的响应；
#   · 响应头先于 HTML 解析生效，连"页面被改坏"这一种情况也兜得住。
#   ★ 与 index.html 里的 <meta> 是**同时生效**（浏览器取交集），不是二选一。
#     改动时两边一起改，`apps/web/tools/test-shell.mjs` 会检查两处都在。

# ---- 内容安全策略 ----
# 守的是本机的 BYOK 密钥：密钥明文存在 localStorage，任何一次 XSS 都能整份读走。
# `script-src 'self'` 让注入进来的行内脚本（<script>…</script>、onerror=…）根本不执行。
#
# 与 <meta> 版的唯一差别：这里**不需要** ws://127.0.0.1:* —— 那是 vite 热更新用的，
# 生产环境没有热更新。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# ---- 其余三条 ----
# 防 MIME 嗅探：否则一个被上传的 .txt 伪装成脚本也可能被当脚本执行。
add_header X-Content-Type-Options "nosniff" always;

# 不把完整 URL（含 hash 之外的查询串）带给外部站点。
add_header Referrer-Policy "no-referrer" always;

# 老浏览器的点击劫持兜底（新浏览器看 frame-ancestors）。
add_header X-Frame-Options "DENY" always;

# ★ 若站点是子路径部署（例如 https://host/structchem/），Vite 的 base 已经是 './'，
#   资源路径是相对的，无需额外配置；只有 SPA 深链接需要 try_files 兜底：
#     location / { try_files $uri $uri/ /index.html; }
#   ★ 本站用 hash 路由（#/crystal），刷新不会产生额外的路径请求，其实不需要它。